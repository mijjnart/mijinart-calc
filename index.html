<!-- 미진아트 간편 견적 박스 (네이버 블로그용) -->
<div style="max-width:420px;margin:30px auto;padding:20px;border-radius:14px;background:#f7f7f7;box-shadow:0 4px 14px rgba(0,0,0,0.08);font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;">
  <h3 style="margin:0 0 8px 0;font-size:18px;">맞춤 액자 간편 견적</h3>
  <p style="margin:0 0 16px 0;font-size:14px;color:#666;">대략적인 예상 금액을 확인해보세요</p>

  <label style="font-size:14px;">가로(cm)</label>
  <input id="w" type="number" style="width:100%;padding:8px;margin:6px 0 12px 0;">

  <label style="font-size:14px;">세로(cm)</label>
  <input id="h" type="number" style="width:100%;padding:8px;margin:6px 0 12px 0;">

  <label style="font-size:14px;">액자 종류</label>
  <select id="t" style="width:100%;padding:8px;margin:6px 0 14px 0;">
    <option value="1">기본 액자</option>
    <option value="1.3">원목 액자</option>
    <option value="1.6">기념·컬렉션 액자</option>
  </select>

  <button onclick="calcPrice()" style="width:100%;padding:10px;border:none;border-radius:10px;background:#222;color:#fff;font-size:14px;">견적 보기</button>

  <div id="r" style="margin-top:14px;padding:10px;background:#fff;border-radius:8px;font-size:14px;">예상 금액이 여기에 표시됩니다.</div>

  <p style="margin-top:12px;font-size:12px;color:#777;text-align:center;">※ 참고용 견적이며 실제 제작 시 달라질 수 있습니다.</p>
</div>

<script>
function calcPrice(){
  var w = document.getElementById('w').value;
  var h = document.getElementById('h').value;
  var t = document.getElementById('t').value;
  if(!w || !h){ alert('사이즈를 입력해주세요 😊'); return; }
  var price = Math.round((w*h*20*t)/100)*100; // 단가 20 수정 가능
  document.getElementById('r').innerHTML = '예상 금액: <b>'+price.toLocaleString()+'원</b>';
}
</script>
